[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "kedi-mcp"
version = "0.1.0"
description = "MCP server for Kedi"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
# PyPI shows the Author field in full but only the first address of Author-email, so names and
# addresses are separate entries.
authors = [
    {name = "Mert Sırakaya"},
    {name = "Doğukan Yiğit Polat"},
    {email = "mert@kedi-lang.org"},
    {email = "yigit@neurograph.net"},
]
dependencies = [
    "fastmcp==3.4.7",
    "kedi>=0.1.5,<0.2",
    "pydantic>=2.14.3,<2.15",
]

[project.scripts]
kedi-mcp = "kedi_mcp.__main__:main"

[project.urls]
Repository = "https://github.com/kedi-lang/kedi-mcp"
Issues = "https://github.com/kedi-lang/kedi-mcp/issues"

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/LICENSE",
    "/src/kedi_mcp",
    "/tests",
    "/install.sh",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/kedi_mcp",
]

[tool.uv.sources]
kedi = { path = "..", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["kedi_mcp"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "\\s*\\.\\.\\.\\s*(#.*)?$",
]

[tool.basedpyright]
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.11"

[dependency-groups]
dev = [
    "basedpyright==1.39.9",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.15.20",
]

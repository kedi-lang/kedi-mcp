[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kedi-mcp"
version = "0.1.1"
description = "MCP Server for Kedi SDK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp",
    "kedi",
]

[project.scripts]
kedi-mcp = "kedi_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["kedi_mcp"]
